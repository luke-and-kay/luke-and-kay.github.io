<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wedding Challenge</title>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="scripts/auth.js" defer></script>
    <script src="scripts/challenge.js" defer></script>

    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Bellefair&family=Engagement&family=Lexend:wght@100..900&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet"
    />
</head>
<body class="challenge-page">
    <header class="schedule-header challenge-header">
        <div class="schedule-title">
            <p class="schedule-kicker">Challenge</p>
            <p class="schedule-subtitle">Choose a person to open their challenge page.</p>
        </div>
        <a class="schedule-back" href="/">Back to invite</a>
    </header>

    <main class="schedule-content challenge-content">
        <div id="challengeApp" data-mode="list" data-max-guests="8"></div>
    </main>
</body>
</html>
